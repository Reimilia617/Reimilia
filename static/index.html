<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reimilia WebUI</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#8a92a6; --accent:#5b8cff; --accent-hover:#7ba2ff;
    --ok:#4caf7d; --err:#ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI",
                "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border); background:var(--panel);
  }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header h1 span { color:var(--accent); }
  button {
    background:var(--accent); color:#fff; border:0; border-radius:6px;
    padding:8px 14px; font-size:13px; cursor:pointer; transition:background .15s;
  }
  button:hover { background:var(--accent-hover); }
  button:disabled { background:var(--panel-2); color:var(--muted); cursor:not-allowed; }
  main {
    display:grid; grid-template-columns:minmax(320px,1fr) minmax(400px,1.3fr);
    gap:16px; padding:16px 24px;
  }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  section {
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px; display:flex; flex-direction:column; min-height:400px;
  }
  section h2 {
    margin:0 0 12px; font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.08em;
  }
  #project-list {
    list-style:none; margin:0; padding:0; overflow-y:auto; max-height:70vh;
  }
  #project-list li {
    display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px;
    padding:10px 12px; border-radius:8px; background:var(--panel-2);
    margin-bottom:8px;
  }
  #project-list .name { font-weight:600; }
  #project-list .url  {
    grid-column:1 / 2; font-size:11px; color:var(--muted); word-break:break-all;
  }
  #log-output {
    flex:1; margin:0; padding:12px; background:#0a0c10; border-radius:8px;
    font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:12px; line-height:1.5; color:#cdd3e0; overflow-y:auto;
    max-height:70vh; white-space:pre-wrap; word-break:break-all;
  }
  .status-err { color:var(--err); }
</style>
</head>
<body>
<header>
  <h1>Reimilia <span>WebUI</span></h1>
  <button id="refresh">刷新项目列表</button>
</header>
<main>
  <section>
    <h2>可部署项目</h2>
    <ul id="project-list"><li>加载中…</li></ul>
  </section>
  <section>
    <h2>部署日志</h2>
    <pre id="log-output">尚未开始部署。</pre>
  </section>
</main>

<script>
  const listEl     = document.getElementById('project-list');
  const logEl      = document.getElementById('log-output');
  const refreshBtn = document.getElementById('refresh');
  let activeES     = null;

  async function loadProjects(force = false) {
    listEl.innerHTML = '<li>加载中…</li>';
    try {
      const res  = await fetch('/api/projects' + (force ? '?refresh=1' : ''));
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '未知错误');
      const entries = Object.entries(data.projects);
      if (!entries.length) {
        listEl.innerHTML = '<li>未找到可部署的项目</li>';
        return;
      }
      listEl.innerHTML = '';
      for (const [name, url] of entries) {
        const li = document.createElement('li');
        const info = document.createElement('div');
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = name;
        const urlEl = document.createElement('div');
        urlEl.className = 'url';
        urlEl.textContent = url;
        info.append(nameEl, urlEl);

        const btn = document.createElement('button');
        btn.textContent = '部署';
        btn.onclick = () => startDeploy(name, url, btn);

        li.append(info, btn);
        listEl.appendChild(li);
      }
    } catch (e) {
      listEl.innerHTML =
        `<li class="status-err">加载失败: ${e.message}</li>`;
    }
  }

  async function startDeploy(name, url, btn) {
    btn.disabled = true;
    btn.textContent = '部署中';
    logEl.textContent = `=== 开始部署 ${name} ===\n`;
    try {
      const res = await fetch('/api/deploy', {
        method : 'POST',
        headers: {'Content-Type': 'application/json'},
        body   : JSON.stringify({ project: name, url }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '启动失败');
      streamLogs(data.task_id);
    } catch (e) {
      appendLog(`错误: ${e.message}\n`);
      btn.disabled = false;
      btn.textContent = '部署';
    }
  }

  function streamLogs(taskId) {
    if (activeES) activeES.close();
    const es = new EventSource(`/api/logs/${taskId}`);
    activeES = es;

    es.onmessage = ev => {
      try {
        const item = JSON.parse(ev.data);
        if (item.type === 'log') appendLog(item.msg + '\n');
      } catch {}
    };

    es.addEventListener('end', () => {
      appendLog('\n=== 会话结束 ===\n');
      es.close();
      activeES = null;
      document.querySelectorAll('#project-list button')
        .forEach(b => { b.disabled = false; b.textContent = '部署'; });
    });

    es.onerror = () => {
      appendLog('\n[连接中断]\n');
      es.close();
      activeES = null;
    };
  }

  function appendLog(text) {
    logEl.textContent += text;
    logEl.scrollTop = logEl.scrollHeight;
  }

  refreshBtn.onclick = () => loadProjects(true);
  loadProjects();
</script>
</body>
</html>
